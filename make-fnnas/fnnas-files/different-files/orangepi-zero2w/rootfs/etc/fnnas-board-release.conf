# FnNAS board release configuration for OrangePi Zero2W (H618)
# https://github.com/one808/fnnas

BOARD_NAME="OrangePi-Zero2W"
SOC="h618"
FAMILY="sun50i-h616"
DTB_FILE="sun50i-h618-orangepi-zero2w.dtb"
BOOT_CONF="armbianEnv.txt"
BOOTLOADER_IMG="u-boot-sunxi-with-spl.bin"

# Hardware specs
MEMORY_OPTIONS="1GB/1.5GB/2GB/4GB LPDDR4"
STORAGE="TF card + 16MB SPI Flash"
